collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "cmd_vel_new"
    transform_tolerance: 0.3
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop" and "slowdown" action types,
    # and robot footprint for "approach" action type.
    # Footprint could be "polygon" type with dynamically set footprint from footprint_topic
    # or "circle" type with static footprint set by radius. "footprint_topic" parameter
    # to be ignored in circular case.
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      points: [0.8, 0.3, 0.8, -0.3, 0.0, -0.3, 0.0, 0.3]
      action_type: "stop"
      max_points: 4
      visualize: True
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: [1.2, 0.3, 1.2, -0.3, -0.3, -0.3, -0.3, 0.3]
      action_type: "slowdown"
      max_points: 4
      slowdown_ratio: 0.5
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["range_1", "range_2", "scan"]
    range_1:
      type: "range"
      topic: "/scan/ultra_1"
    range_2:
      type: "range"
      topic: "/scan/ultra_2"
    scan:
      type: "scan"
      topic: "/scan"
      

  # ros2 service call /collision_monitor/set_parameters rcl_interfaces/srv/SetParameters "{parameters: [{name: 'PolygonStop.points', value: {double_array_value: [1.0, 0.25, 1.0, -0.25, 0.0, -0.25, 0.0, 0.25]}}]}"
# ros2 param set /collision_monitor PolygonStop.points "[1.0, 0.25, 1.0, -0.25, 0.0, -0.25, 0.0, 0.25]"
